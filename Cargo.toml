[package]
name = "capta"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Microphone capture in pure Rust with no C library, through the PulseAudio protocol on Linux, WASAPI on Windows and Core Audio on macOS."
repository = "https://github.com/mesa-hills-research/capta"
documentation = "https://docs.rs/capta"
readme = "README.md"
keywords = ["audio", "microphone", "recording", "pipewire", "wasapi"]
categories = ["multimedia::audio"]

# The crate uses only the standard library, and the system's own libraries on Windows and macOS.

# An independent encoder and decoder of the PulseAudio protocol, for the tests to check ours
# against.
[target.'cfg(target_os = "linux")'.dev-dependencies]
pulseaudio = "=0.3.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[[example]]
name = "capta-record"
path = "examples/capta-record.rs"
